name: Publish SDK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing unpublished release tag to retry
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Verify protected release identity
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          package_version="$(node --print 'require("./package.json").version')"
          if [[ "$RELEASE_TAG" != "v$package_version" ]]; then
            echo "Tag $RELEASE_TAG does not match package version $package_version." >&2
            exit 1
          fi
          git fetch --no-tags origin master
          tagged_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
          if [[ "$(git rev-parse HEAD)" != "$tagged_sha" ]]; then
            echo "Release checkout does not match tag $RELEASE_TAG." >&2
            exit 1
          fi
          if [[ "$RELEASE_EVENT" == "push" && "$tagged_sha" != "$(git rev-parse origin/master)" ]]; then
            echo "SDK releases must tag the current protected master commit." >&2
            exit 1
          fi
          if [[ "$RELEASE_EVENT" == "workflow_dispatch" ]] && ! git merge-base --is-ancestor "$tagged_sha" origin/master; then
            echo "SDK release retries must use a tag reachable from protected master." >&2
            exit 1
          fi
          if [[ "$RELEASE_EVENT" == "workflow_dispatch" ]]; then
            mapfile -t retry_changes < <(git diff --name-only "$tagged_sha" origin/master)
            for changed_path in "${retry_changes[@]}"; do
              if [[ "$changed_path" != ".github/workflows/publish.yml" ]]; then
                echo "Protected master differs from $RELEASE_TAG outside the publish workflow: $changed_path" >&2
                exit 1
              fi
            done
          fi
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "SDK release checkout is not clean." >&2
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.17.0
          registry-url: https://registry.npmjs.org

      - name: Install trusted-publishing npm CLI
        run: npm install --global npm@11.6.2

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run the complete SDK test suite
        run: npm test

      - name: Publish with npm provenance
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
