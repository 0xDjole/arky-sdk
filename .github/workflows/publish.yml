name: Publish SDK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Verify protected release identity
        run: |
          set -euo pipefail
          package_version="$(node --print 'require("./package.json").version')"
          if [[ "$GITHUB_REF_NAME" != "v$package_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $package_version." >&2
            exit 1
          fi
          git fetch --no-tags origin master
          if [[ "$GITHUB_SHA" != "$(git rev-parse origin/master)" ]]; then
            echo "SDK releases must tag the current protected master commit." >&2
            exit 1
          fi
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "SDK release checkout is not clean." >&2
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.17.0
          registry-url: https://registry.npmjs.org

      - name: Install trusted-publishing npm CLI
        run: npm install --global npm@12.0.1

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run the complete SDK test suite
        run: npm test

      - name: Publish with npm provenance
        run: npm publish --access public --provenance
